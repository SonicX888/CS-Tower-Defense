# Builds a Windows version of the game on GitHub's servers.
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
# The result is downloadable from the run's page under "Artifacts".
name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: CS-Tower-Defense

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: CS-Tower-Defense/pom.xml

      - name: Build the JAR with Maven
        run: mvn -B package

      - name: Package the game as a Windows app (.exe + bundled Java)
        run: |
          mkdir dist
          cp target/CS-Tower-Defense-1.0-SNAPSHOT.jar dist/
          jpackage --type app-image \
            --name "CS Tower Defense" \
            --input dist \
            --main-jar CS-Tower-Defense-1.0-SNAPSHOT.jar \
            --main-class com.mycompany.cs_tower_defense.Main \
            --dest release

      - name: Upload the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: CS-Tower-Defense-Windows
          path: CS-Tower-Defense/release/
